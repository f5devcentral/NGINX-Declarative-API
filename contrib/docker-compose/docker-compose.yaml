volumes:
  redis_data:

services:
  redis:
    image: redis
    container_name: "redis"
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - dapi-network
    volumes:
      - redis_data:/data:rw

  devportal:
    image: ghcr.io/f5devcentral/nginx-declarative-api-devportal
    build:
      context: ../devportal/redocly
      dockerfile: Dockerfile
    user: "${USERID}:${USERGROUP}"
    container_name: "devportal"
    restart: always
    ports:
      - "${DEVPORTAL_PORT:-5001}:5000"
    networks:
      - dapi-network

  nginx-dapi:
    image: ghcr.io/f5devcentral/nginx-declarative-api
    build:
      context: ../../
      dockerfile: Dockerfile
    user: "${USERID}:${USERGROUP}"
    container_name: "nginx-dapi"
    restart: always
    depends_on:
      - redis
    ports:
      - "${DAPI_PORT:-5000}:5000"
    networks:
      - dapi-network

  webui:
    image: ghcr.io/f5devcentral/nginx-declarative-api-webui
    build:
      context: ../../webui
      dockerfile: Dockerfile
    container_name: "nginx-dapi-webui"
    restart: always
    depends_on:
      - nginx-dapi
    environment:
      - DAPI_PORT=5000
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    networks:
      - dapi-network

  nginx-dapi-mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    image: ghcr.io/f5devcentral/nginx-dapi-mcp
    container_name: nginx-dapi-mcp
    restart: unless-stopped
    environment:
      NDAPI_BASE_URL: "http://nginx-dapi:${DAPI_PORT:-5000}"
      NDAPI_VERSION: "v5.7"
      NDAPI_AUTH_MODE: "none"
      NDAPI_API_KEY: "${NDAPI_API_KEY:-}"
      NDAPI_VERIFY_TLS: "true"
      MCP_TRANSPORT: "streamable-http"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8800"
      DAPI_PORT: "5000"
    ports:
      - "${MCP_PORT:-8800}:8800"
    networks:
      - dapi-network

networks:
  dapi-network:
