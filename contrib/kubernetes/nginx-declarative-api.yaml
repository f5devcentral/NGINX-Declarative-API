apiVersion: v1
kind: Namespace
metadata:
  name: nginx-dapi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nginx-dapi
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  replicas: 1
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:8.10
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - "--save"
        - ""
        - "--appendonly"
        - "no"
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  # Fixed name "redis" — etc/config.yaml connects to hostname "redis" by default
  name: redis
  namespace: nginx-dapi
  labels:
    app: redis
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    app: redis
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dapi
  namespace: nginx-dapi
  labels:
    app: nginx-dapi
spec:
  selector:
    matchLabels:
      app: nginx-dapi
  replicas: 1
  template:
    metadata:
      labels:
        app: nginx-dapi
    spec:
      containers:
      - name: nginx-dapi
        image: ghcr.io/f5devcentral/nginx-declarative-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /docs
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /docs
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-dapi
  namespace: nginx-dapi
  labels:
    app: nginx-dapi
spec:
  ports:
  - name: http
    port: 5000
    targetPort: http
    protocol: TCP
  selector:
    app: nginx-dapi
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devportal
  namespace: nginx-dapi
  labels:
    app: devportal
spec:
  selector:
    matchLabels:
      app: devportal
  replicas: 1
  template:
    metadata:
      labels:
        app: devportal
    spec:
      containers:
      - name: devportal
        image: ghcr.io/f5devcentral/nginx-declarative-api-devportal:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  # Fixed name "devportal" — etc/config.yaml connects to hostname "devportal" by default
  name: devportal
  namespace: nginx-dapi
  labels:
    app: devportal
spec:
  ports:
  - name: http
    port: 5000
    targetPort: http
    protocol: TCP
  selector:
    app: devportal
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: nginx-dapi
  labels:
    app: webui
spec:
  selector:
    matchLabels:
      app: webui
  replicas: 1
  template:
    metadata:
      labels:
        app: webui
    spec:
      securityContext:
        runAsNonRoot: true
        # uid 101 matches nginx user in nginxinc/nginx-unprivileged
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: webui
        image: ghcr.io/f5devcentral/nginx-declarative-api-webui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          # nginx-unprivileged listens on 8080 by default
          containerPort: 8080
          protocol: TCP
        env:
        - name: DAPI_PORT
          value: "5000"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: nginx-dapi
  labels:
    app: webui
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: webui
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: nginx-dapi
  labels:
    app: mcp
spec:
  selector:
    matchLabels:
      app: mcp
  replicas: 1
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
      - name: mcp
        image: ghcr.io/f5devcentral/nginx-declarative-api-mcp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8800
          protocol: TCP
        env:
        - name: NDAPI_BASE_URL
          value: "http://nginx-dapi:5000"
        - name: NDAPI_VERSION
          value: "v5.7"
        - name: NDAPI_AUTH_MODE
          value: "none"
        - name: NDAPI_VERIFY_TLS
          value: "true"
        - name: MCP_TRANSPORT
          value: "streamable-http"
        - name: MCP_HTTP_HOST
          value: "0.0.0.0"
        - name: MCP_HTTP_PORT
          value: "8800"
        - name: DAPI_PORT
          value: "5000"
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: nginx-dapi
  labels:
    app: mcp
spec:
  ports:
  - name: http
    port: 8800
    targetPort: http
    protocol: TCP
  selector:
    app: mcp
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-dapi
  namespace: nginx-dapi
  labels:
    app: nginx-dapi
spec:
  ingressClassName: nginx
  rules:
    - host: nginx-dapi.k8s.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-dapi
                port:
                  number: 5000
    - host: nginx-dapi-webui.k8s.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  number: 80
    - host: nginx-dapi-mcp.k8s.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8800

